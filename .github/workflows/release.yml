name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-release:
    name: Build & Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign APK (if Secrets Configured)
        id: sign_app
        if: ${{ env.SIGNING_KEY != '' }}
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # 1. Find latest installed Android build-tools (zipalign & apksigner)
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Using Android Build Tools at: $BUILD_TOOLS_DIR"

          # 2. Decode the Base64 keystore
          echo "$SIGNING_KEY" | base64 --decode > /tmp/release.keystore

          # 3. Find the generated release APK
          UNSIGNED_APK=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          SIGNED_APK="app/build/outputs/apk/release/Lumi-${{ github.ref_name }}.apk"

          # 4. Zipalign
          $BUILD_TOOLS_DIR/zipalign -f -v -p 4 "$UNSIGNED_APK" /tmp/aligned.apk

          # 5. Sign APK with apksigner
          $BUILD_TOOLS_DIR/apksigner sign \
            --ks /tmp/release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --key-pass pass:"$KEY_PASSWORD" \
            --out "$SIGNED_APK" \
            /tmp/aligned.apk

          # 6. Verify signature
          $BUILD_TOOLS_DIR/apksigner verify --verbose "$SIGNED_APK"

          echo "signed_apk_path=$SIGNED_APK" >> $GITHUB_OUTPUT
          rm -f /tmp/release.keystore /tmp/aligned.apk

      - name: Prepare APK for Release Upload
        id: prepare_apk
        run: |
          if [ -n "${{ steps.sign_app.outputs.signed_apk_path }}" ] && [ -f "${{ steps.sign_app.outputs.signed_apk_path }}" ]; then
            echo "apk_path=${{ steps.sign_app.outputs.signed_apk_path }}" >> $GITHUB_OUTPUT
          else
            APK_FILE=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
            echo "apk_path=$APK_FILE" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Release ${{ github.ref_name }}"
          files: |
            ${{ steps.prepare_apk.outputs.apk_path }}
            app/build/outputs/mapping/release/mapping.txt
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
